# Render blueprint for the SENTINEL API (the React dashboard is deployed on Vercel).
# New > Blueprint > pick this repo; fill in the secret values when prompted.
services:
  - type: web
    name: sentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false            # secret: entered in the Render dashboard
      - key: VOICE_MODE
        value: "off"
      - key: ALLOWED_ORIGINS
        value: https://sentinel-eight-chi.vercel.app
